[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "funcqual"
version = "0.2.1"
description = "Internal validity and MBSE-usefulness evaluation of SysML-like (SJS) functional models"
readme = "docs/FUNCQUAL.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "networkx>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "typer>=0.12",
  "mcp>=1.10",          # 1.x (FastMCP) and 2.x (MCPServer) are both supported
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
funcqual = "funcqual.cli:app"
funcqual-mcp = "funcqual.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/funcqual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
