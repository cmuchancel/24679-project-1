[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysml-gliner"
version = "0.1.0"
description = "Weakly supervised SysML-to-GLiNER fine-tuning pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
    "gliner[training]>=0.2.29,<0.3",
    "torch>=2.0.0",
    "transformers>=4.51.3,<5.17.0",
]
dev = ["pytest>=8,<9"]

[project.scripts]
sysml-gliner = "sysml_gliner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
