name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-agents.txt
      - run: python -m pip install -r requirements-agents.txt pytest
      - name: Validate the exact released training corpus
        run: python scripts/build_gliner_dataset.py
      - name: Check the current packaged interface without live model calls
        run: python -m pytest tests/test_live_ui.py tests/test_diagram_tabs.py tests/test_graph_view.py tests/test_gliner_windowing.py tests/test_blind_quality.py tests/test_patent_example.py
